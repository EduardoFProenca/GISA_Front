<div class="secao">
  <h3>
    Endereço e Contato
    <span class="subtitulo-secao">Localização e formas de contato</span>
  </h3>

  <div class="linha-form">
    <div class="campo">
      <label for="cep">CEP *</label>
      <input type="text" id="cep" name="cep" [(ngModel)]="cep" placeholder="00000-000">
    </div>
    <div class="campo campo-largo">
      <label for="endereco">Endereço *</label>
      <input type="text" id="endereco" name="endereco" [(ngModel)]="endereco" placeholder="Rua, avenida, etc.">
    </div>
  </div>

  <div class="linha-form linha-tripla">
    <div class="campo">
      <label for="numero">Número *</label>
      <input type="text" id="numero" name="numero" [(ngModel)]="numero" placeholder="Nº">
    </div>
    <div class="campo">
      <label for="complemento">Complemento</label>
      <input type="text" id="complemento" name="complemento" [(ngModel)]="complemento" placeholder="Apto, bloco, etc.">
    </div>
    <div class="campo">
      <label for="bairro">Bairro *</label>
      <input type="text" id="bairro" name="bairro" [(ngModel)]="bairro" placeholder="Nome do bairro">
    </div>
  </div>

  <div class="linha-form">
    <div class="campo campo-largo">
      <label for="cidade">Cidade *</label>
      <input type="text" id="cidade" name="cidade" [(ngModel)]="cidade" placeholder="Nome da cidade">
    </div>
    <div class="campo">
      <label for="uf">UF *</label>
      <select id="uf" name="uf" [(ngModel)]="uf">
        <option value="" disabled selected>Selecione</option>
        <option value="SP">SP</option>
        <option value="RJ">RJ</option>
        <option value="MG">MG</option>
      </select>
    </div>
  </div>

  
 
</div>
