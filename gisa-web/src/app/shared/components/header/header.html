<header class="header-principal">
  <div class="header-esquerda" style="display: flex; align-items: center; gap: 0.75rem;">
    @if (mostrarBotaoMenu) {
      <button type="button" class="btn-icone" (click)="layout.toggleMenu()" aria-label="Abrir ou fechar menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    }
    <div>
      <strong>{{ nome }}</strong>
      <p>{{ funcao }}</p>
    </div>
  </div>

  <div class="header-direita">
    @if (exibirNotificacoes) {
    <div class="notificacoes">
      <button type="button" class="btn-icone" aria-label="Notificações" aria-haspopup="true"
        [attr.aria-expanded]="painelAberto()" (click)="alternarPainel()">
        <span [innerHTML]="sanitizarIcone(icones.sino)"></span>
        @if (notificacoes.naoLidas() > 0) {
          <span class="badge">{{ notificacoes.naoLidas() > 9 ? '9+' : notificacoes.naoLidas() }}</span>
        }
      </button>

      @if (painelAberto()) {
        <div class="painel-notificacoes" role="dialog" aria-label="Notificações">
          <div class="painel-topo">
            <strong>Notificações</strong>
            @if (notificacoes.naoLidas() > 0) {
              <button type="button" class="link" (click)="notificacoes.marcarTodasComoLidas()">
                Marcar todas como lidas
              </button>
            }
          </div>

          @for (n of notificacoes.itens(); track n.id) {
            <button type="button" class="item" [class.nao-lida]="!n.lida"
              (click)="notificacoes.marcarComoLida(n.id)">
              <span class="item-titulo">{{ n.titulo }}</span>
              @if (n.mensagem) {
                <span class="item-msg">{{ n.mensagem }}</span>
              }
              <span class="item-tempo">{{ tempo(n.criadaEm) }}</span>
            </button>
          } @empty {
            <p class="vazio">Nenhuma notificação.</p>
          }
        </div>
      }
    </div>
    }

    <button type="button" class="btn-sair" (click)="sair()">
      <span [innerHTML]="sanitizarIcone(icones.sair)"></span>
      Sair
    </button>
  </div>
</header>
