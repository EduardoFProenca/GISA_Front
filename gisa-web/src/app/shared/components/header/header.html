<header class="header-principal">
  <div class="header-esquerda">
    @if (mostrarBotaoMenu) {
      <button appBotao type="button" variante="fantasma" somenteIcone class="acao-topo" [icone]="icones.menu"
        (click)="layout.toggleMenu()" aria-label="Abrir ou fechar menu"></button>
    }
    <div>
      <!-- No celular vira a saudação "Olá, Nome!". -->
      <strong><span class="so-celular">Olá, </span>{{ nome }}<span class="so-celular">!</span></strong>
      <p>{{ funcao }}</p>
    </div>
  </div>

  <div class="header-direita">
    @if (exibirNotificacoes) {
    <div class="notificacoes">
      <button appBotao type="button" variante="fantasma" somenteIcone class="acao-topo btn-notificacoes"
        [icone]="icones.sino" aria-label="Notificações" aria-haspopup="true"
        [attr.aria-expanded]="painelAberto()" (click)="alternarPainel()">
        @if (notificacoes.naoLidas() > 0) {
          <span class="badge">{{ notificacoes.naoLidas() > 9 ? '9+' : notificacoes.naoLidas() }}</span>
        }
      </button>

      @if (painelAberto()) {
        <div class="painel-notificacoes" role="dialog" aria-label="Notificações">
          <div class="painel-topo">
            <strong>Notificações</strong>
            @if (notificacoes.naoLidas() > 0) {
              <button type="button" class="link" (click)="notificacoes.marcarTodasComoLidas()">
                Marcar todas como lidas
              </button>
            }
          </div>

          @for (n of notificacoes.itens(); track n.id) {
            <button type="button" class="item" [class.nao-lida]="!n.lida"
              (click)="notificacoes.marcarComoLida(n.id)">
              <span class="item-titulo">{{ n.titulo }}</span>
              @if (n.mensagem) {
                <span class="item-msg">{{ n.mensagem }}</span>
              }
              <span class="item-tempo">{{ tempo(n.criadaEm) }}</span>
            </button>
          } @empty {
            <p class="vazio">Nenhuma notificação.</p>
          }
        </div>
      }
    </div>
    }

    @if (rotaSenha) {
    <a appBotao variante="fantasma" class="acao-topo" [icone]="icones.senha"
      [routerLink]="rotaSenha" aria-label="Alterar senha">
      <span class="rotulo">Alterar senha</span>
    </a>
    }

    <button appBotao type="button" variante="fantasma" class="acao-topo" [icone]="icones.sair"
      (click)="sair()" aria-label="Sair">
      <span class="rotulo">Sair</span>
    </button>
  </div>
</header>
