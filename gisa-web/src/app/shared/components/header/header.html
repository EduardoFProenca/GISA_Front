<header class="header-principal">
  <div class="header-esquerda">
    <div class="avatar">
      @if (auth.usuarioAtual()?.fotoUrl) {
        <img [src]="auth.usuarioAtual()!.fotoUrl" alt="Foto de perfil">
      } @else {
        <span [innerHTML]="icones.pessoa"></span>
      }
    </div>
    <div>
      <strong>{{ tituloPortal }}</strong>
      <p>{{ subtituloPortal }}</p>
    </div>
  </div>

  <div class="header-direita">
    <span class="notificacao" [innerHTML]="sanitizarIcone(icones.sino)"></span>
    <a (click)="auth.logout()">
      <span [innerHTML]="sanitizarIcone(icones.sair)"></span>
      Sair
    </a>
  </div>
</header>
