<nav class="menu-lateral" >

<!--<nav class="menu-lateral" [class.fechado]="!layout.menuAberto()">-->
  <div class="menu-usuario">
    <span>{{ nomeUsuario }}</span>
  </div>

  <ul>
    @for (item of itens; track item.rota) {
      <li>
        <a [routerLink]="item.rota" routerLinkActive="ativo">
          <span class="menu-icone" [innerHTML]="sanitizarIcone(item.iconeSvg)"></span>
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</nav>
