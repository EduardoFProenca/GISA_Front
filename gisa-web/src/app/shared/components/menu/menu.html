@if (!menuFechado) {
  <div class="fundo" (click)="fechar()"></div>
}

<nav
  class="menu-lateral"
  aria-label="Menu principal"
  [class.fechado]="menuFechado"
  [attr.aria-hidden]="menuFechado"
  [attr.inert]="menuFechado ? '' : null">
  <!-- Largura fixa: só a moldura (nav) anima, o texto não se rearranja ao abrir/fechar. -->
  <div class="menu-conteudo">

  @if (nome) {
    <div class="menu-usuario" [title]="nome">
      <span>{{ nome }}</span>
    </div>
  }

  <ul>
    @for (item of itens; track item.rota; let i = $index) {
      @if (iniciaGrupo(i)) {
        <li class="grupo" role="presentation">{{ item.grupo }}</li>
      }
      <li>
        <a
          [routerLink]="item.rota"
          routerLinkActive="ativo"
          [routerLinkActiveOptions]="{ exact: item.exato ?? false }"
          (click)="aoNavegar()">
          <span class="menu-icone"><ng-icon [name]="item.icone" /></span>
          <span class="menu-rotulo">{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>
  </div>
</nav>
