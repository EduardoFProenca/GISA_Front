@if (!menuFechado) {
  <div class="fundo" (click)="fechar()"></div>
}

<nav
  class="menu-lateral"
  aria-label="Menu principal"
  [class.fechado]="menuFechado"
  [attr.aria-hidden]="menuFechado"
  [attr.inert]="menuFechado ? '' : null">

  @if (nome) {
    <div class="menu-usuario">
      <span>{{ nome }}</span>
    </div>
  }

  <ul>
    @for (item of itens; track item.rota) {
      <li>
        <a
          [routerLink]="item.rota"
          routerLinkActive="ativo"
          [routerLinkActiveOptions]="{ exact: item.exato ?? false }"
          (click)="aoNavegar()">
          <span class="menu-icone" [innerHTML]="sanitizarIcone(item.iconeSvg)"></span>
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</nav>
