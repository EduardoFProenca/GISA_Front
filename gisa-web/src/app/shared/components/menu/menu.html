<nav class="menu-lateral">
  <div class="menu-usuario">
    <span>{{ nomeUsuario }}</span>
  </div>

  <ul>
    @for (item of itens; track item.rota) {
      <li>
        <a [routerLink]="item.rota" routerLinkActive="ativo">
          <span class="menu-icone">{{ item.icone }}</span>
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</nav>
