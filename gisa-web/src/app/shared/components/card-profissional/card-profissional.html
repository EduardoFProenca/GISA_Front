<div class="card-prof" (click)="abrirDetalhe()">
  <div class="avatar-prof">
    {{ profissional.nome.charAt(0) }}
  </div>

  <div class="corpo-prof">
    <div class="topo-prof">
      <strong>{{ profissional.nome }}</strong>
      <div class="acoes-prof">
        <button type="button" class="btn-editar" title="Ver histórico" (click)="abrirHistorico($event)">
          <ng-icon [name]="icones.historico" />
        </button>
        @if (podeEditar) {
          <button type="button" class="btn-editar" title="Editar" (click)="abrirEdicao($event)">
            <span><ng-icon [name]="icones.editar" /></span>
          </button>
        }
      </div>
    </div>
    <div class="campos-card">
      <app-campo-detalhe rotulo="Cargo">{{ profissional.cargo }}</app-campo-detalhe>
      <app-campo-detalhe rotulo="Registro">{{ profissional.crm }}</app-campo-detalhe>
    </div>

    <span class="status-badge" [class]="classeStatus">
      {{ profissional.statusCadastro }}
    </span>
  </div>
</div>
