@if (aberto) {
  <div class="overlay">
    <div class="dialog">
      <div class="icone-sucesso">
        <ng-icon [name]="icones.confirmado" size="32" strokeWidth="3" />
      </div>

      <h3>{{ titulo }}</h3>
      <p>{{ mensagem }}</p>

      <div class="dialog-acoes">
        <button type="button" class="btn-secundario" (click)="aoContinuar()">{{ textoSecundario }}</button>
        <button type="button" class="btn-primario" (click)="aoVerDetalhes()">{{ textoPrimario }}</button>
      </div>
    </div>
  </div>
}
