@if (aberto) {
  <div class="overlay">
    <div class="dialog">
      <div class="icone-sucesso">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5" />
        </svg>
      </div>

      <h3>{{ titulo }}</h3>
      <p>{{ mensagem }}</p>

      <div class="dialog-acoes">
        <button type="button" class="btn-secundario" (click)="aoContinuar()">{{ textoSecundario }}</button>
        <button type="button" class="btn-primario" (click)="aoVerDetalhes()">{{ textoPrimario }}</button>
      </div>
    </div>
  </div>
}
