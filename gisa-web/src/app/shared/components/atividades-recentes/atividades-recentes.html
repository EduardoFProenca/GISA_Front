<div class="painel">
  <h3>{{ titulo }}</h3>
  <ul>
    @for (item of atividades; track item.descricao) {
      <li>
        <div class="info">
          <strong>{{ item.descricao }}</strong>
          <span>{{ item.tempoAtras }}</span>
        </div>

        @if (item.acoes && item.acoes.length > 0) {
          <div class="acoes-atividade">
            @for (acao of item.acoes; track acao.label) {
              <button appBotao type="button" variante="fantasma" tamanho="sm" [icone]="acao.icone" [somenteIcone]="!!acao.icone"
                [title]="acao.label" [attr.aria-label]="acao.label" (click)="acao.acao()">
                @if (!acao.icone) {
                  {{ acao.label }}
                }
              </button>
            }
          </div>
        }
      </li>
    } @empty {
      <li class="vazio">{{ vazio }}</li>
    }
  </ul>
</div>
