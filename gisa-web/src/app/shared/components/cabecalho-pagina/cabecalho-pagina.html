<header class="cabecalho-pagina">
  <div class="cabecalho-esquerda">
    <button type="button" class="btn-icone" (click)="layout.toggleMenu()" aria-label="Abrir menu">
      <ng-icon [name]="icones.menu" size="20" />
    </button>

    <button type="button" class="btn-icone" (click)="voltar()" aria-label="Voltar">
      <ng-icon [name]="icones.voltar" size="20" />
    </button>

    <strong class="titulo-pagina">{{ titulo }}</strong>
  </div>

    <div class="cabecalho-direita">
    @if (textoAcaoSecundaria) {
      <button type="button" class="btn-acao-secundaria" (click)="aoClicarAcaoSecundaria()">{{ textoAcaoSecundaria }}</button>
    }

    @if (textoAcao) {
      <button type="button" class="btn-acao" (click)="aoClicarAcao()">
        <ng-icon [name]="tipoAcao === 'editar' ? icones.editar : icones.adicionar" />
        {{ textoAcao }}
      </button>
    }

    @if (mostrarCancelar) {
      <button type="button" class="btn-cancelar" (click)="aoClicarCancelar()">Cancelar</button>
    }

    @if (mostrarSalvar) {
      <button type="button" class="btn-salvar" [disabled]="salvarDesabilitado"
        [attr.title]="salvarDesabilitado ? motivoSalvarDesabilitado || null : null"
        (click)="aoClicarSalvar()">Salvar</button>
    }
  </div>
</header>
