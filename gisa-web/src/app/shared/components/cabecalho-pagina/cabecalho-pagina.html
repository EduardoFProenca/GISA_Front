<header class="cabecalho-pagina">
  <div class="cabecalho-esquerda">
    <button appBotao type="button" variante="fantasma" somenteIcone [icone]="icones.menu"
      (click)="layout.toggleMenu()" aria-label="Abrir menu"></button>

    <button appBotao type="button" variante="fantasma" somenteIcone [icone]="icones.voltar"
      (click)="voltar()" aria-label="Voltar"></button>

    <strong class="titulo-pagina">{{ titulo }}</strong>
  </div>

  <div class="cabecalho-direita">
    @if (textoAcaoSecundaria) {
      <button appBotao type="button" variante="contorno" (click)="aoClicarAcaoSecundaria()">{{ textoAcaoSecundaria }}</button>
    }

    @if (textoAcao) {
      <button appBotao type="button" [icone]="tipoAcao === 'editar' ? icones.editar : icones.adicionar"
        (click)="aoClicarAcao()">{{ textoAcao }}</button>
    }

    @if (mostrarCancelar) {
      <button appBotao type="button" variante="neutro" (click)="aoClicarCancelar()">Cancelar</button>
    }

    @if (mostrarSalvar) {
      <button appBotao type="button" data-concluir [disabled]="salvarDesabilitado"
        [attr.title]="salvarDesabilitado ? motivoSalvarDesabilitado || null : null"
        (click)="aoClicarSalvar()">Salvar</button>
    }
  </div>
</header>
