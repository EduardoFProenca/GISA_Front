<div class="select-busca" [class.disabled]="disabled">
  <input
    type="text"
    [ngModel]="termo()"
    (ngModelChange)="aoDigitar($event)"
    (focus)="aoFocar()"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [class.input-erro]="comErro"
    autocomplete="off"
  >

  @if (aberto() && !disabled) {
    <ul class="lista-opcoes">
      @for (opcao of opcoesFiltradas; track opcao.id) {
        <li (mousedown)="selecionar(opcao)">{{ opcao.label }}</li>
      } @empty {
        <li class="sem-resultados">{{ semResultados }}</li>
      }
    </ul>
  }
</div>
