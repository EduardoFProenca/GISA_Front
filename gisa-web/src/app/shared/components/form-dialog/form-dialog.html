@if (aberto()) {
  <div class="overlay" [class.sem-rolagem]="!rolagem()" (click)="cancelar.emit()">
    <form class="dialog" (click)="$event.stopPropagation()" (submit)="$event.preventDefault(); confirmar.emit()">
      <h3>{{ titulo() }}</h3>
      @if (descricao()) {
        <p class="descricao">{{ descricao() }}</p>
      }

      <div class="form-dialog-conteudo">
        <ng-content />
      </div>

      @if (erro()) {
        <p class="erro">{{ erro() }}</p>
      }

      <div class="dialog-acoes">
        <button appBotao type="button" variante="neutro" (click)="cancelar.emit()">{{ textoCancelar() }}</button>
        <button appBotao type="submit" data-concluir [disabled]="salvando()">
          {{ salvando() ? 'Salvando...' : textoConfirmar() }}
        </button>
      </div>
    </form>
  </div>
}
