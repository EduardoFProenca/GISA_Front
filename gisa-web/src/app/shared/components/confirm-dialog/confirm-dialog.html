<app-dialogo [aberto]="aberto" [titulo]="titulo" largura="sm" (fechar)="aoCancelar()">
  @if (mensagem) {
    <p class="mensagem">{{ mensagem }}</p>
  }
  <ng-content select="[dialog-message]" />
  <!-- Conteúdo extra opcional (ex.: opções a marcar antes de confirmar) -->
  <ng-content />

  <div class="dialogo-acoes">
    <button appBotao type="button" variante="neutro" (click)="aoCancelar()">{{ textoCancelar }}</button>
    <button appBotao type="button" data-concluir [variante]="varianteConfirmar" (click)="aoConfirmar()">
      {{ textoConfirmar }}
    </button>
  </div>
</app-dialogo>
