<article class="card-consulta" [class.cancelada]="cancelada()">
  <header class="card-topo">
    <div>
      <strong class="horario">{{ horario() }}</strong>
      <span class="meta">{{ meta() }}</span>
    </div>
    <span class="badge" [attr.data-status]="consulta().status">{{ labelStatus() }}</span>
  </header>

  <ul class="lista-pacientes">
    @for (p of consulta().pacientes; track p.idPaciente) {
    <li>
      <app-linha-paciente-presenca
        [paciente]="p"
        [bloqueado]="bloqueado(p)"
        (marcarPresente)="marcar(p, StatusPresenca.PRESENTE)"
        (marcarFalta)="marcar(p, StatusPresenca.FALTA_INJUSTIFICADA)"
        (marcarFaltaJustificada)="marcar(p, StatusPresenca.FALTA_JUSTIFICADA, $event)" />
    </li>
    } @empty {
    <li class="vazio">Nenhum paciente vinculado a esta consulta.</li>
    }
  </ul>
</article>
