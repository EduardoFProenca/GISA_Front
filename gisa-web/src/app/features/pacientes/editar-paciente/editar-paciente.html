<app-cabecalho-pagina
  titulo="Editar Paciente"
  [mostrarSalvar]="true"
  [mostrarCancelar]="true"
  (salvar)="salvarEdicao()"
  (cancelar)="cancelar()"
></app-cabecalho-pagina>

<div class="card-form">
  @if (carregando()) {
    <!-- carregando: overlay global (app-loading-spinner) -->
  } @else if (erro()) {
    <p class="aviso erro-msg">{{ erro() }}</p>
  } @else if (paciente()) {
    <p class="legenda-obrigatorio">Campos com <span class="obrigatorio">*</span> são obrigatórios.</p>

    @if (erroGeral()) {
      <p class="erro-msg erro-geral">{{ erroGeral() }}</p>
    }

    <!-- Situação -->
    <div class="secao">
      <h3>Situação do Paciente</h3>
      <div class="campo">
        <label for="status">Status <span class="obrigatorio">*</span></label>
        <app-select-menu id="status" name="status" [ngModel]="status()" (ngModelChange)="status.set($event)">
          <option value="MATRICULADO">Matriculado</option>
          <option value="ALTA">Alta</option>
          <option value="DESLIGADO">Desligado</option>
        </app-select-menu>
      </div>
    </div>


    <!-- Dados Pessoais -->
    <app-dados-pessoais
      [dadosIniciais]="dadosPessoais()"
      [bloquearCpfSexoNascimento]="true"
      [exibirEmail]="false"
      [celularObrigatorio]="false"
    ></app-dados-pessoais>


    <!-- Informações administrativas -->
    <app-info-paciente [convenioInicial]="convenioInicial()" />


    <!-- Responsáveis (adicionar, editar e remover) -->
    <app-info-responsavel #infoResp [responsaveisIniciais]="responsaveisIniciais()" [enderecosPaciente]="enderecosPaciente" />
    <ng-template #moradores let-e>
      <app-quem-mora-aqui [chave]="e.chave" [residentes]="residentes(infoResp)" />
    </ng-template>


    <!-- Endereços -->
    <app-lista-enderecos #enderecosPaciente titulo="Endereços" [obrigatorio]="true"
      subtitulo="Quem reside com o paciente acompanha as alterações. Se alguém não se mudou, marque que ele não reside."
      [enderecosIniciais]="enderecosIniciais()"
      [extraCard]="mostrarMoradores(infoResp, enderecosPaciente) ? moradores : undefined"
      (mudou)="ajustarMoradores(infoResp, enderecosPaciente)" />


    <!-- Assistentes sociais (gravados ao salvar) -->
    <app-assistentes-sociais-edicao [iniciais]="assistentesIniciais()" [podeAlterar]="podeVincular" />

    <!-- Escola -->
    <app-info-escola [escolaInicial]="escolaInicial()" />


    <!-- Prontuário -->
    <app-info-prontuario [prontuarioInicial]="prontuarioInicial()" />


    <!-- CIDs (adicionar e remover) -->
    <app-info-cid [cidsIniciais]="cidsIniciais()" />
  }
</div>

<!-- 409: endereço alterado também é de outros cadastros. -->
<app-dialogo-endereco-compartilhado
  [aberto]="enderecosCompartilhados().length > 0"
  [itens]="enderecosCompartilhados()"
  (confirmar)="confirmarEnderecosCompartilhados($event)"
  (cancelar)="enderecosCompartilhados.set([])"
/>

<!-- 409: responsável que passa a residir e ainda mora com outros pacientes. -->
<app-dialogo-residencia-outros-pacientes
  [aberto]="residenciasOutros().length > 0"
  [itens]="residenciasOutros()"
  (confirmar)="confirmarResidenciasOutros($event)"
  (cancelar)="residenciasOutros.set([])"
/>

<!-- Modal de Confirmação para Descartar Alterações -->
<app-confirm-dialog
  [aberto]="confirmarCancelamentoAberto()"
  titulo="Descartar alterações?"
  mensagem="As alterações feitas nesta edição serão perdidas."
  textoConfirmar="Descartar"
  textoCancelar="Continuar editando"
  (confirmar)="confirmarCancelamento()"
  (cancelar)="confirmarCancelamentoAberto.set(false)"
></app-confirm-dialog>

<!-- Modal de Sucesso ao Salvar -->
