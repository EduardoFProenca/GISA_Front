<div class="secao">
  <h3>Informações Escolares</h3>

  <div class="linha-tripla">
    <div class="campo">
      <label>Nome da Escola</label>
      <app-select-busca [buscar]="buscarEscolas" [opcoes]="opcoesConhecidas"
        [value]="escolaSelecionada?.idEscola ?? null" (valueChange)="aoEscolher($event)"
        [textoLivre]="true" [texto]="nome" (textoChange)="aoDigitarNome($event)"
        placeholder="Digite para buscar ou cadastrar"
        semResultados="Nenhuma escola encontrada: ela será cadastrada como nova"
        [comErro]="!!(erros['nome'] || erros['escola'])" />
      @if (escolaSelecionada) {
        <span class="dica-escola">Escola já cadastrada.</span>
      } @else if (escolaNova) {
        <span class="dica-escola">Escola nova: será cadastrada junto com o paciente.</span>
      }
      @if (erros['nome']) { <span class="erro-msg">{{ erros['nome'] }}</span> }
      @if (erros['escola']) { <span class="erro-msg">{{ erros['escola'] }}</span> }
    </div>

    <div class="campo">
      <label for="tipoEscola">Tipo de Escola @if (escolaNova) { <span class="obrigatorio">*</span> }</label>
      <select id="tipoEscola" name="tipoEscola" [(ngModel)]="tipoEscola" [disabled]="!!escolaSelecionada"
        [class.input-erro]="erros['tipoEscola']" (change)="limparErro('tipoEscola')">
        <option value="" disabled selected>Selecione</option>
        @for (item of opcoesTipoEscola; track item.value) {
          <option [value]="item.value">{{ item.label }}</option>
        }
      </select>
      @if (erros['tipoEscola']) { <span class="erro-msg">{{ erros['tipoEscola'] }}</span> }
    </div>

    <div class="campo">
      <label for="telefoneEscola">Telefone da Escola</label>
      <input type="text" id="telefoneEscola" appMascara="celular" inputmode="numeric" name="telefoneEscola" [(ngModel)]="telefone"
        [disabled]="!!escolaSelecionada" placeholder="(00) 0000-0000">
    </div>
  </div>
</div>
