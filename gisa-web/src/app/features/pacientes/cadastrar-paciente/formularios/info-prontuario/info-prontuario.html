<div class="secao">
  <h3>Informações do Prontuário</h3>

  <div class="linha-tripla">
    <div class="campo">
      <label for="alergias">Alergias</label>
      <input type="text" id="alergias" name="alergias" [(ngModel)]="alergias"
        placeholder="Ex: Dipirona, Lácteos (ou Nenhuma)">
    </div>

    <div class="campo">
      <label for="comorbidade">Comorbidades</label>
      <input type="text" id="comorbidade" name="comorbidade" [(ngModel)]="comorbidade"
        placeholder="Ex: Asma, Epilepsia...">
    </div>

    <div class="campo">
      <label for="mobilidade">Mobilidade</label>
      <input type="text" id="mobilidade" name="mobilidade" [(ngModel)]="mobilidade"
        placeholder="Ex: Cadeira de rodas, Muletas, Reduzida...">
    </div>
  </div>

  @if (erros['prontuario']) { <span class="erro-msg">{{ erros['prontuario'] }}</span> }
</div>
