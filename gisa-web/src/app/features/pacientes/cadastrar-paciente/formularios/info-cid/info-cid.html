<div class="secao">
  <h3>Diagnóstico / CIDs</h3>

  <div class="linha-form linha-cid">
    <div class="campo">
      <label>Código CID</label>
      <app-select-busca
        [opcoes]="opcoes"
        [value]="codigoSelecionado()"
        (valueChange)="aoEscolherCodigo($event)"
        [limite]="50"
        placeholder="Digite o código ou o nome. Ex: F84.0 ou autismo"
        semResultados="Nenhum CID encontrado"
      />
    </div>

    <div class="campo">
      <label>Descrição da Doença / Diagnóstico</label>
      <input
        type="text"
        class="campo-fechado"
        [value]="descricao()"
        readonly
        tabindex="-1"
        placeholder="Preenchida automaticamente ao escolher o código"
      />
    </div>
  </div>

  @if (erro()) {
    <span class="erro-msg erro-cid">{{ erro() }}</span>
  }
  @if (erros['cids']) {
    <span class="erro-msg erro-cid">{{ erros['cids'] }}</span>
  }

  <button
    type="button"
    class="add-item"
    [disabled]="!cidSelecionado() || verificando()"
    (click)="adicionarCid()"
  >
    {{ verificando() ? 'Verificando...' : '+ Adicionar CID' }}
  </button>

  @if (listaCids().length > 0) {
    <div class="lista-cids-adicionados">
      @for (cid of listaCids(); track cid.codigoCID; let i = $index) {
        <div class="tag-cid">
          <span><strong>{{ cid.codigoCID }}</strong> - {{ cid.descricao }}</span>
          <button type="button" class="btn-remover" title="Remover" (click)="removerCid(i)">✕</button>
        </div>
      }
    </div>
  }
</div>
