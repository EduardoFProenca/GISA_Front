<div class="card-prof" (click)="abrirDetalhe()">
  <div class="avatar-prof">
    {{ paciente.nome.charAt(0) }}
  </div>

  <div class="corpo-prof">
    <div class="topo-prof">
      <strong>{{ paciente.nome }}</strong>
      @if (!somenteLeitura) {
        <button type="button" class="btn-editar" title="Editar" (click)="abrirEdicao($event)">
          <span><ng-icon [name]="icones.editar" /></span>
        </button>
      }
    </div>

    <div class="campos-card">
      <app-campo-detalhe rotulo="Idade">{{ paciente.idade }} anos</app-campo-detalhe>
      <app-campo-detalhe rotulo="CPF">{{ cpfFormatado }}</app-campo-detalhe>
      <app-campo-detalhe rotulo="Responsável">{{ nomeResponsavel }}</app-campo-detalhe>
      <app-campo-detalhe rotulo="CID">{{ cidPrincipal }}</app-campo-detalhe>
    </div>

    <span class="status-badge" [class]="classeStatus">
      {{ rotuloStatus }}
    </span>
  </div>
</div>
