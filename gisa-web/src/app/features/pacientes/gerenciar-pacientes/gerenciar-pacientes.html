<app-cabecalho-pagina
  titulo="Gestão de Pacientes"
  [textoAcao]="podeCadastrar ? 'Novo Paciente' : ''"
  [rotaAcao]="rotaBase + '/novo'"
/>

<div class="pagina-profissionais">
  <div class="stats-grid">
    <app-card-estatistica
      titulo="Total de Pacientes"
      [valor]="totalElementos()"
      [icone]="icones.gestaoPacientes"
      corIcone="#dbeafe"
    />
  </div>

  <div class="painel-busca">
    <app-busca-filtro
      placeholder="Buscar por nome ou CPF..."
      (buscaAlterada)="aplicarBusca($event)"
    />

    <br><br>

    @if (erro()) {
      <p class="vazio">{{ erro() }}</p>
    }

    <div class="grid-profissionais">
      @for (paciente of pacientes(); track paciente.idCadastro) {
        <app-card-paciente [paciente]="paciente" [somenteLeitura]="!podeEditar" [rotaBase]="rotaBase" />
      } @empty {
        @if (carregando()) {
          <p class="vazio">Carregando pacientes...</p>
        } @else if (!erro()) {
          <p class="vazio">Nenhum paciente encontrado.</p>
        }
      }
    </div>
  </div>

  <app-paginacao
    [totalItens]="totalElementos()"
    [itensPorPagina]="itensPorPagina"
    [paginaAtual]="paginaAtual()"
    (paginaAlterada)="mudarPagina($event)"
  />
</div>
