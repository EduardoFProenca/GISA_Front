<div class="stats-grid">

    [icone]="icones.calendario" tom="azul" />
  <app-card-estatistica titulo="Compareceram" [valor]="resumo().presentes"
    [icone]="icones.gestaoConsultas" tom="verde" />
  <app-card-estatistica titulo="Faltas" [valor]="resumo().faltas"
    [icone]="icones.sino" tom="vermelho" />
  <app-card-estatistica titulo="Pendentes" [valor]="resumo().pendentes"
    [icone]="icones.pessoa" tom="ambar" />
</div>
