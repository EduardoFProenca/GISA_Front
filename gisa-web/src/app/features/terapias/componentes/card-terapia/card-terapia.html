<article class="card-consulta" [class]="classeStatus" [class.coletiva]="ehColetiva">

  <div class="topo">
    <div class="icone" [title]="labelModalidade"><ng-icon [name]="icone" /></div>

    <div class="titulos">
      <div class="linha-titulo">
        <strong [title]="titulo">{{ titulo }}</strong>
        <span class="badge-status">{{ labelStatus }}</span>
      </div>
      <p class="subtitulo">{{ subtitulo }}</p>
    </div>
  </div>

  <p class="meta">
    <span>{{ data }}</span>
    <span class="sep">·</span>
    <span>{{ horario }}</span>
    <span class="sep">·</span>
    <span>{{ labelModalidade }}</span>
  </p>

  @if (ehColetiva) {
    <ul class="participantes">
      @for (p of visiveis; track p.id) {
        <li class="chip" [class.especialista]="p.tipo === 'ESPECIALISTA'" [title]="tooltip(p)">
          <span class="ponto"></span>{{ nomeCurto(p.nome) }}
        </li>
      }
      @if (ocultos > 0) {
        <li class="chip mais" [title]="nomesOcultos">+{{ ocultos }}</li>
      }
    </ul>
  }

  <div class="rodape">
    <button type="button" class="btn btn-detalhes" (click)="verDetalhes.emit(terapia.idTerapia)">
      Detalhes
    </button>

    <div class="acoes">
      @if (podeEditar) {
        <button type="button" class="btn btn-icone" title="Editar terapia" aria-label="Editar terapia"
          (click)="editar.emit(terapia.idTerapia)">
          <span><ng-icon [name]="icones.editar" /></span>
        </button>
      }

      @if (podeCancelar) {
        <button type="button" class="btn btn-icone perigo" title="Cancelar terapia" aria-label="Cancelar terapia"
          (click)="cancelar.emit(terapia.idTerapia)">
          <ng-icon [name]="icones.cancelar" />
        </button>
      }
    </div>
  </div>

</article>
