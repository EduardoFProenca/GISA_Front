<div class="login-page">
    <img class="q-icon" src="img_logoApae.png" alt="APAE Sorocaba">
    <h1>APAE de Saúde</h1>
    <p class="subtitle">Sistema de Gestão Integrada</p>

    <div class="login-container container-login">
        <h3>Acesso ao Sistema</h3>
        <h6>Informe seu CPF de cadastro e senha para continuar</h6>

        <label for="usuario">CPF de Cadastro:</label>
        <input type="text" [(ngModel)]="usuario" appMascara="cpf" inputmode="numeric" [class.input-erro]="erroUsuario()" placeholder="000.000.000-00"
            name="usuario" id="usuario">
        @if (erroUsuario()) {
        <span class="erro-msg">O CPF deve ter 11 dígitos</span>
        }

        <label for="senha">Sua Senha:</label>
        <div class="senha-wrapper">
            <input [type]="mostrarSenha() ? 'text' : 'password'" [(ngModel)]="senha" [class.input-erro]="erroSenha()"
                placeholder="Digite sua senha" name="senha" id="senha">
            <button type="button" class="toggle-senha" (click)="toggleSenha()"
                [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
                [title]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'">
                <ng-icon [name]="mostrarSenha() ? icones.olhoFechado : icones.olho" size="20" />
            </button>
        </div>
        @if (erroSenha()) {
        <span class="erro-msg">Senha deve ter pelo menos 8 caracteres</span>
        }

        @if (erroLogin()) {
        <span class="erro-msg">{{ erroLogin() }}</span>
        }

        <button type="button" class="btn-entrar" (click)="fazerLogin()" [disabled]="carregando()">{{ carregando() ? (demorando() ? 'Aguardando o servidor...' : 'Entrando...') : 'Entrar' }}</button>
        <br>
        <!-- <a class="esqueci-senha" (click)="esqueciSenha()">Esqueci a senha</a> -->
    </div>
</div>
