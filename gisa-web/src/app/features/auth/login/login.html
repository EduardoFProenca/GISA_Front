<div class="login-page">
    <img class="q-icon" src="img/logo-apae.webp" alt="APAE Sorocaba">
    <h1>GISA</h1>
    <p class="subtitle">Sistema de Gestão Integrada</p>

    <form class="login-container container-login" (ngSubmit)="fazerLogin()">
        <h3>Acesso ao Sistema</h3>
        <h6>Informe seu e-mail e senha para continuar</h6>

        <label for="email">E-mail:</label>
        <input type="email" [(ngModel)]="email" [class.input-erro]="erroEmail()" placeholder="seu.email@exemplo.com"
            name="email" id="email" autocomplete="username">
        @if (erroEmail()) {
        <span class="erro-msg">Informe um e-mail válido</span>
        }

        <label for="senha">Sua Senha:</label>
        <div class="senha-wrapper">
            <input [type]="mostrarSenha() ? 'text' : 'password'" [(ngModel)]="senha" [class.input-erro]="erroSenha()"
                placeholder="Digite sua senha" name="senha" id="senha" autocomplete="current-password">
            <button type="button" class="toggle-senha" (click)="toggleSenha()"
                [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
                [title]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'">
                <ng-icon [name]="mostrarSenha() ? icones.olhoFechado : icones.olho" size="20" />
            </button>
        </div>
        @if (erroSenha()) {
        <span class="erro-msg">Senha deve ter pelo menos 8 caracteres</span>
        }

        @if (erroLogin()) {
        <span class="erro-msg">{{ erroLogin() }}</span>
        }

        <button type="submit" class="btn-entrar" [disabled]="carregando()">{{ carregando() ? (demorando() ? 'Aguardando o servidor...' : 'Entrando...') : 'Entrar' }}</button>
        <a class="esqueci-senha" routerLink="/esqueci-senha">Esqueci minha senha</a>
    </form>
</div>
