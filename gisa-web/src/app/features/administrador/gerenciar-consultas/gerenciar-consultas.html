<app-cabecalho-pagina titulo="Gestão de Consultas" textoAcao="Nova Consulta"
  rotaAcao="/administrador/consultas/nova" />

<div class="pagina-profissionais">

  <div class="stats-grid">
    <app-card-estatistica titulo="Total de Consultas" [valor]="totalElementos()"
      [iconeSvg]="icones.gestaoConsultas" corIcone="#dbeafe" />
    <app-card-estatistica titulo="Agendadas" [valor]="totalAgendadas()"
      [iconeSvg]="icones.calendario" corIcone="#dbeafe" />
    <app-card-estatistica titulo="Concluídas" [valor]="totalConcluidas()"
      [iconeSvg]="icones.estrela" corIcone="#dcfce7" />
    <app-card-estatistica titulo="Canceladas" [valor]="totalCanceladas()"
      [iconeSvg]="icones.sino" corIcone="#fee2e2" />
  </div>

  <div class="painel-busca">
    <app-busca-filtro placeholder="Buscar por paciente ou especialista..." (buscaAlterada)="aplicarBusca($event)" />

    <app-filtro-avancado
      [statusDisponiveis]="statusDisponiveis"
      [periodosDisponiveis]="periodosDisponiveis"
      (filtroAlterado)="aplicarFiltroAvancado($event)" />

    @if (erro()) {
    <p class="vazio">{{ erro() }}</p>
    }

    <div class="grid-profissionais">
      @for (consulta of consultasPaginadas(); track consulta.id) {
      <app-card-consulta
        [consulta]="consulta"
        (verDetalhes)="verDetalhes($event)"
        (editar)="editarConsulta($event)"
        (adicionarPessoas)="adicionarPessoas($event)"
        (cancelar)="pedirCancelamento($event)" />
      } @empty {
      @if (!carregando() && !erro()) {
      <p class="vazio">Nenhuma consulta encontrada.</p>
      }
      }
    </div>
  </div>

  <app-paginacao [totalItens]="totalElementos()" [itensPorPagina]="itensPorPagina" [paginaAtual]="paginaAtual()"
    (paginaAlterada)="mudarPagina($event)" />

</div>

<app-confirm-dialog
  [aberto]="consultaParaCancelar() !== null"
  titulo="Cancelar consulta?"
  [mensagem]="mensagemCancelamento()"
  textoConfirmar="Cancelar consulta"
  textoCancelar="Voltar"
  (confirmar)="confirmarCancelamento()"
  (cancelar)="fecharCancelamento()" />
