<app-header tituloPortal="Administrador" subtituloPortal="Portal do Administrador" />

<div class="corpo-dashboard">
  <div class="stats-grid">
    <app-card-estatistica titulo="Total de Pacientes" [valor]="totalPacientes()"
      [icone]="icones.gestaoPacientes" corIcone="#dbeafe" />
    <app-card-estatistica titulo="Total de Profissionais" [valor]="totalProfissionais()"
      [icone]="icones.gestaoProfissionais" corIcone="#dcfce7" />
    <app-card-estatistica titulo="Profissionais Ativos" [valor]="profissionaisAtivos()"
      [icone]="icones.cadastrarProfissional" corIcone="#fef3c7" />
  </div>

  <div class="conteudo-principal">
    <app-painel-acoes [acoes]="acoesRapidas" />
    <app-atividades-recentes [atividades]="terapiasHoje()" titulo="Terapias de hoje" vazio="Nenhuma terapia agendada para hoje." />
  </div>
</div>
