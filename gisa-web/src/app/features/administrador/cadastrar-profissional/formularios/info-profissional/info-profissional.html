<fieldset class="secao" [disabled]="somenteLeitura">
  <h3>Profissional</h3>

  <div class="linha-form">
    <div class="campo">
      <label for="cargo">Cargo <span class="obrigatorio">*</span></label>
      <select id="cargo" name="cargo" [(ngModel)]="cargo" [class.input-erro]="erros['cargo']"
        (change)="limparErro('cargo')">
        <option value="" disabled>Selecione o cargo</option>
        @for (c of cargos; track c.idCargo) {
          <option [value]="'' + c.idCargo">{{ c.nome }}</option>
        }
      </select>
      @if (erros['cargo']) { <span class="erro-msg">{{ erros['cargo'] }}</span> }
    </div>
    <div class="campo">
      <label for="codigoCBO">CBO</label>
      <input type="text" id="codigoCBO" name="codigoCBO" [value]="cbo" readonly tabindex="-1"
        placeholder="Definido pelo cargo">
    </div>
  </div>
</fieldset>
