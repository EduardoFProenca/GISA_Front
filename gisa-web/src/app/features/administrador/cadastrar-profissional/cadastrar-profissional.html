<app-cabecalho-pagina
  titulo="Cadastrar Profissional"
  [mostrarSalvar]="true"
  (salvar)="salvarCadastro()">
</app-cabecalho-pagina>

  <div class="card-form">
    <p class="legenda-obrigatorio">Campos com <span class="obrigatorio">*</span> são obrigatórios.</p>

    @if (erro) {
    <p class="erro-msg erro-geral">{{ erro }}</p>
    }

    <!-- Um item só: quando a geração muda, os formulários são recriados vazios. -->
    @for (g of [geracaoFormulario()]; track g) {
    <app-dados-pessoais />
    <br>
    <hr>
    <app-info-profissional [cargos]="opcoes().cargos"></app-info-profissional>
    <br>
    <hr>
    <app-info-usuario [perfis]="opcoes().perfis" />
    <br>
    <hr>
    <app-info-especialista [especialidadesDisponiveis]="opcoes().especialidades" />
    <br>
    <hr>
    <app-contato subtitulo="Opcional. Se informar, preencha o endereço completo." />
    }
  </div>
