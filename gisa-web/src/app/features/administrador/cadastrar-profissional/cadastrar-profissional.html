<div class="pagina-cadastro">
  <div class="topo-form">
    <a class="voltar" routerLink="/administrador">← Voltar</a>
    <div class="titulo-form">
      <h2>Cadastrar Novo Profissional</h2>
      <p>Adicionar ao corpo clínico</p>
    </div>
    <button class="salvar-btn">💾 Salvar Cadastro</button>
  </div>

  <div class="card-form">
    <app-dados-pessoais />

    @if (!tipo()) {
      <app-selecao-tipo (tipoSelecionado)="tipo.set($event)" />
    } @else {
      @switch (tipo()) {
        @case ('medico') { <app-info-medico /> }
        @case ('assistente-social') { <app-info-assistente-social /> }
      }
    }

    <app-contato />
  </div>
</div>
