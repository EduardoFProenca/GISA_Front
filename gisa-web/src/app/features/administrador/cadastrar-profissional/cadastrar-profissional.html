<div class="pagina-cadastro">


  <div class="card-form">
    

    @if (!tipo()) {
      <app-selecao-tipo (tipoSelecionado)="tipo.set($event)" />
    } @else {
      @switch (tipo()) {
        @case ('medico') { <app-info-medico /> }
        @case ('assistente-social') { <app-info-assistente-social /> }
      }
    }


  </div>
</div>
