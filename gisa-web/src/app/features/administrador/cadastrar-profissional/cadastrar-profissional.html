<app-cabecalho-pagina
  titulo="Cadastrar Profissional"
  [mostrarSalvar]="true"
  (salvar)="salvarCadastro()">
</app-cabecalho-pagina>

  <div class="card-form">
    <app-dados-pessoais />
    <br>
    <hr>
    <app-info-profissional></app-info-profissional>
    <br>
    <hr>
    <app-info-usuario />
    <br>
    <hr>
    <app-info-especialista />
    <br>
    <hr>
    <app-contato />
    
  </div>

  @if (erro) {
  <p class="erro-msg">{{ erro }}</p>
  }

  <app-sucesso-dialog
    [aberto]="dialogSucessoAberto"
    titulo="Profissional cadastrado com sucesso!"
    [mensagem]="nomeCadastrado + ' foi salvo(a) no sistema.'"
    textoPrimario="Ver detalhes"
    textoSecundario="Continuar cadastrando"
    (verDetalhes)="aoVerDetalhesCadastrado()"
    (continuar)="aoContinuarCadastrando()">
  </app-sucesso-dialog>
