<app-cabecalho-pagina [titulo]="nome() ? 'Terapias de ' + nome() : 'Terapias do Profissional'"></app-cabecalho-pagina>

<div class="card-form">
  @if (erro()) {
  <p class="vazio">{{ erro() }}</p>
  } @else if (!atendeTerapias()) {
  <p class="vazio">Este cadastro não é de especialista, então não participa de terapias.</p>
  } @else {
  <app-filtro-avancado [statusDisponiveis]="statusDisponiveis" (filtroAlterado)="aplicarFiltro($event)" />

  <div class="grid-terapias">
    @for (t of terapias(); track t.idTerapia) {
    <app-card-terapia [terapia]="t" [permitirEditar]="false" [permitirCancelar]="false"
      (verDetalhes)="verDetalhes($event)" />
    } @empty {
    @if (carregando()) {
    <p class="vazio">Carregando terapias...</p>
    } @else {
    <p class="vazio">Nenhuma terapia encontrada.</p>
    }
    }
  </div>

  <app-paginacao [totalItens]="total()" [itensPorPagina]="itensPorPagina" [paginaAtual]="pagina()"
    (paginaAlterada)="mudarPagina($event)" />
  }
</div>
