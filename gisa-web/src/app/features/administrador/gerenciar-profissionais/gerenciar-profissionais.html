<app-cabecalho-pagina titulo="Gestão de Profissionais" [textoAcao]="podeCadastrar ? 'Novo Profissional' : ''"
    rotaAcao="/administrador/profissionais/novo" />

<div class="pagina-profissionais">

    <div class="stats-grid">
        <app-card-estatistica titulo="Total de Profissionais" [valor]="totalElementos()"
            [icone]="icones.gestaoProfissionais" corIcone="#dbeafe" />
    </div>

    <div class="painel-busca">
        <app-busca-filtro placeholder="Buscar por nome ou CPF..." [filtrosDisponiveis]="filtros"
            (buscaAlterada)="aplicarBusca($event)" />

        <br><br>

        @if (erro()) {
        <p class="vazio">{{ erro() }}</p>
        }

        <div class="grid-profissionais">
            @for (prof of profissionaisPaginados(); track prof.id) {
            <app-card-profissional [profissional]="prof" [podeEditar]="podeEditar" />
            } @empty {
            @if (!carregando() && !erro()) {
            <p class="vazio">Nenhum profissional encontrado.</p>
            }
            }
        </div>
    </div>
    <app-paginacao [totalItens]="totalElementos()" [itensPorPagina]="itensPorPagina"
        [paginaAtual]="paginaAtual()" (paginaAlterada)="mudarPagina($event)" />

</div>
