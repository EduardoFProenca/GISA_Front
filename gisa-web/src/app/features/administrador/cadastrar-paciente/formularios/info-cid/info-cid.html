<div class="secao">
  <h3>Diagnóstico / CIDs</h3>

  <div class="linha-form">
    <div class="campo">
      <label>Código CID</label>
      <input 
        type="text" 
        [(ngModel)]="codigoInput" 
        placeholder="Ex: F84.0" 
      />
    </div>

    <div class="campo campo-descricao">
      <label>Descrição da Doença / Diagnóstico</label>
      <input 
        type="text" 
        [(ngModel)]="descricaoInput" 
        placeholder="Ex: Autismo Infantil" 
      />
    </div>

    <button type="button" class="btn-adicionar" (click)="adicionarCid()">
      Adicionar CID
    </button>
  </div>

  <!-- Lista de CIDs Adicionados -->
  <div class="lista-cids-adicionados" *ngIf="listaCids.length > 0">
    <div class="tag-cid" *ngFor="let cid of listaCids; let i = index">
      <span><strong>{{ cid.codigoCID }}</strong> - {{ cid.descricao }}</span>
      <button type="button" class="btn-remover" (click)="removerCid(i)">✕</button>
    </div>
  </div>
</div>
