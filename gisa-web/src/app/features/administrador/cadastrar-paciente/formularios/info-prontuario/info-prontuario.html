<div class="secao">
  <h3>Informações do Prontuário</h3>

  <div class="linha-form">
    <div class="campo">
      <label>Alergias</label>
      <input type="text" [(ngModel)]="prontuarioData.alergias" placeholder="Ex: Dipirona, Lácteos (ou Nenhuma)" />
    </div>

    <div class="campo">
      <label>Comorbidades</label>
      <input type="text" [(ngModel)]="prontuarioData.comorbidade" placeholder="Ex: Asma, Epilepsia..." />
    </div>

    <div class="campo">
      <label>Mobilidade</label>
      <input type="text" [(ngModel)]="prontuarioData.mobilidade" placeholder="Ex: Cadeira de rodas, Muletas, Reduzida..." />
    </div>
  </div>
</div>
