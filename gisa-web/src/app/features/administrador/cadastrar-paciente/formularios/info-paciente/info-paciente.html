<div class="secao">
  <h3>Informações Administrativas do Paciente</h3>

  <div class="linha-form">
    <div class="campo">
      <label>Possui Convênio?</label>
      <select [ngModel]="pacienteData.convenio ? 'true' : 'false'" (ngModelChange)="pacienteData.convenio = ($event === 'true')">
        <option value="false">Não</option>
        <option value="true">Sim</option>
      </select>
    </div>
  </div>
</div>
