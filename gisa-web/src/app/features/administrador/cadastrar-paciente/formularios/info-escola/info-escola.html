<div class="form-section">
  <h3>Informações Escolares</h3>
  
  <div class="form-group">
    <label>Nome da Escola</label>
    <input type="text" [(ngModel)]="escola.nome" placeholder="Digite o nome da escola" />
  </div>

  <div class="form-group">
    <label>Tipo de Escola</label>
    <select [(ngModel)]="escola.tipoEscola">
      <option *ngFor="let tipo of tiposEscola" [value]="tipo.value">
        {{ tipo.label }}
      </option>
    </select>
  </div>

  <div class="form-group">
    <label>Telefone da Escola</label>
    <input type="text" [(ngModel)]="escola.telefone" placeholder="(00) 00000-0000" />
  </div>
</div>
