<div class="secao">
  <h3>Informações do Responsável</h3>

  <div class="linha-form">
    <div class="campo">
      <label>Nome do Responsável</label>
      <input type="text" [(ngModel)]="responsavelData.nome" placeholder="Digite o nome completo" />
    </div>

    <div class="campo">
      <label>CPF</label>
      <input type="text" [(ngModel)]="responsavelData.cpf" placeholder="000.000.000-00" />
    </div>
  </div>

  <div class="linha-form">
    <div class="campo">
      <label>Telefone / WhatsApp</label>
      <input type="text" [(ngModel)]="responsavelData.telefone" placeholder="(00) 00000-0000" />
    </div>

    <div class="campo">
      <label>Ocupação / Profissão</label>
      <input type="text" [(ngModel)]="responsavelData.ocupacao" placeholder="Ex: Professor, Autônomo..." />
    </div>

    <div class="campo">
      <label>Grau de Parentesco</label>
      <select [(ngModel)]="responsavelData.grauParentesco">
        <option value="" disabled selected>Selecione...</option>
        <option *ngFor="let item of opcoesParentesco" [value]="item.value">
          {{ item.label }}
        </option>
      </select>
    </div>
  </div>
</div>
