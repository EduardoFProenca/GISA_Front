<app-form-dialog
  [aberto]="aberto()"
  [titulo]="cbo() ? 'Editar CBO' : 'Novo CBO'"
  [descricao]="cbo() ? 'O código não pode ser alterado. Para corrigir um código errado, cadastre o CBO certo, mova os cargos para ele e exclua o antigo.' : 'Classificação Brasileira de Ocupações: busque a ocupação pelo nome ou código na tabela oficial (CBO 2002), ou digite o código abaixo.'"
  [erro]="erro()"
  [salvando]="salvando()"
  (confirmar)="salvar()"
  (cancelar)="cancelar.emit()">
  @if (!cbo()) {
  <div>
    <label>Buscar na CBO oficial</label>
    <app-select-busca [opcoes]="opcoesOficiais()" [value]="escolhidoOficial()" (valueChange)="escolherOficial($event)"
      [limite]="50" [disabled]="!opcoesOficiais().length"
      [placeholder]="opcoesOficiais().length ? 'Digite o código ou o nome. Ex: 2515-10 ou psicólogo' : 'Carregando a tabela da CBO...'"
      semResultados="Nenhuma ocupação encontrada" />
  </div>
  }
  <div>
    <label for="codigoCbo">Código <span class="obrigatorio">*</span></label>
    <input id="codigoCbo" name="codigoCbo" type="text" appMascara="cbo" inputmode="numeric" placeholder="0000-00"
      [disabled]="!!cbo()" [class.input-erro]="erros()['codigoCBO']"
      [ngModel]="codigo()" (ngModelChange)="aoMudarCodigo($event)" />
    @if (erros()['codigoCBO']) { <span class="erro-msg">{{ erros()['codigoCBO'] }}</span> }
  </div>
  <div>
    <label for="tituloCbo">Título <span class="obrigatorio">*</span></label>
    <input id="tituloCbo" appFiltro="texto" name="tituloCbo" type="text" maxlength="255" placeholder="Ex.: Psicólogo clínico"
      [class.input-erro]="erros()['tituloCBO']" [ngModel]="titulo()" (ngModelChange)="titulo.set($event)" />
    @if (erros()['tituloCBO']) { <span class="erro-msg">{{ erros()['tituloCBO'] }}</span> }
  </div>
</app-form-dialog>
