<app-form-dialog
  [aberto]="aberto()"
  [titulo]="perfil() ? 'Renomear perfil' : 'Novo perfil'"
  [descricao]="perfil() ? '' : 'Um perfil é um conjunto de permissões. Cada usuário de acesso tem exatamente um perfil.'"
  [erro]="erro()"
  [salvando]="salvando()"
  (confirmar)="salvar()"
  (cancelar)="cancelar.emit()">
  <div>
    <label for="nomePerfil">Nome do perfil <span class="obrigatorio">*</span></label>
    <input id="nomePerfil" name="nomePerfil" type="text" maxlength="255" placeholder="Ex.: Recepção"
      [class.input-erro]="erroNome()" [ngModel]="nome()" (ngModelChange)="nome.set($event)" />
    @if (erroNome()) { <span class="erro-msg">{{ erroNome() }}</span> }
  </div>

  @if (!perfil()) {
  <div>
    <label>Permissões iniciais</label>
    <app-seletor-permissoes [permissoes]="permissoes()" [selecionadas]="selecionadas()"
      (selecionadasChange)="selecionadas.set($event)" />
    <p class="dica">Pode ficar sem nenhuma e ser ajustado depois.</p>
  </div>
  }
</app-form-dialog>
