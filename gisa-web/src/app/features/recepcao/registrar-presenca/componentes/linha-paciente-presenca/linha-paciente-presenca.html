<div class="linha-paciente">
  <div class="info-paciente">
    <span class="nome">{{ paciente().nome }}</span>
    <span class="situacao" [attr.data-presenca]="paciente().presenca ?? 'PENDENTE'">{{ rotulo() }}</span>
    @if (paciente().justificativa) {
    <small class="justificativa">"{{ paciente().justificativa }}"</small>
    }
  </div>

  <div class="acoes">
    <button type="button" class="btn presente"
      [class.ativo]="paciente().presenca === StatusPresenca.PRESENTE"
      [disabled]="bloqueado()"
      (click)="marcarPresente.emit()">Compareceu</button>

    <button type="button" class="btn falta-justificada"
      [class.ativo]="paciente().presenca === StatusPresenca.FALTA_JUSTIFICADA"
      [disabled]="bloqueado()"
      (click)="abrir()">Falta justificada</button>

    <button type="button" class="btn falta"
      [class.ativo]="paciente().presenca === StatusPresenca.FALTA_INJUSTIFICADA"
      [disabled]="bloqueado()"
      (click)="marcarFalta.emit()">Falta</button>
  </div>

  @if (editando()) {
  <div class="justificativa-form">
    <input type="text" maxlength="255" placeholder="Motivo da falta (ex.: atestado médico)"
      [ngModel]="texto()" (ngModelChange)="texto.set($event)"
      (keyup.enter)="confirmar()" />
    <button type="button" class="btn confirmar"
      [disabled]="!texto().trim() || bloqueado()"
      (click)="confirmar()">Confirmar</button>
    <button type="button" class="btn secundario" (click)="fechar()">Cancelar</button>
  </div>
  }
</div>
