<app-header tituloPortal="Portal da Recepção" subtituloPortal="Recepção" />

<div class="corpo-dashboard">
  <main class="conteudo">
    <div class="stats-grid">
      <app-card-estatistica titulo="Terapias Hoje" [valor]="resumo()?.terapias ?? '—'" [icone]="icones.calendario" tom="azul" />
      <app-card-estatistica titulo="Presenças Confirmadas" [valor]="resumo()?.presentes ?? '—'" [icone]="icones.gestaoConsultas" tom="verde" />
      <app-card-estatistica titulo="Presenças Pendentes" [valor]="resumo()?.pendentes ?? '—'" [icone]="icones.pessoa" tom="ambar" />
    </div>

    <div class="conteudo-principal">
      <app-painel-acoes [acoes]="acoesRapidas" />
      <app-atividades-recentes [atividades]="terapiasHoje()" titulo="Terapias de hoje" vazio="Nenhuma terapia agendada para hoje." />
    </div>
  </main>
</div>
