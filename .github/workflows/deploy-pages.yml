# Publica o front (gisa-web) no GitHub Pages a cada push na main.
# Site: https://eduardofproenca.github.io/GISA_Front/
# Pré-requisito (uma vez): Settings > Pages > Source = "GitHub Actions".
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um push novo cancela o que ainda está na fila.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gisa-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gisa-web/package-lock.json

      - run: npm ci

      - run: npm test -- --watch=false

      # O site fica em /GISA_Front/ (nome do repositório).
      - run: npx ng build --base-href /GISA_Front/

      # SPA: o Pages devolve o 404.html para rotas que não existem como arquivo
      # (ex.: /GISA_Front/administrador/pacientes ao recarregar a página).
      - run: cp dist/gisa-web/browser/index.html dist/gisa-web/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: gisa-web/dist/gisa-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
